#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx
  - ca-certificates
  - curl
  - gnupg

runcmd:
  # Node.js 24 LTS
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs
  # pnpm
  - npm install -g pnpm@latest
    # Fix permissions on pnpm cache created as root
  - mkdir -p /home/azureuser/.local/share/pnpm
  - chown -R azureuser:azureuser /home/azureuser/.local
  # Fix permissions on /var/www/html created as root by nginx package
  - rm -rf /var/www/html
  - mkdir -p /var/www/html
  - chown -R azureuser:azureuser /var/www/html
  # App directory
  - mkdir -p /opt/cloud-project
  - chown azureuser:azureuser /opt/cloud-project
  # Nginx
  - nginx -t && systemctl restart nginx
  - systemctl enable nginx
  # Node app service (started by deploy script)
  - systemctl enable nodeapp

write_files:
  - path: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          root /var/www/html;
          index index.html;

          location /api/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              client_max_body_size 50m;
          }

          location / {
              try_files $uri $uri/ /index.html;
          }
      }
  - path: /etc/systemd/system/nodeapp.service
    content: |
      [Unit]
      Description=Node.js API
      After=network.target

      [Service]
      Type=simple
      User=azureuser
      WorkingDirectory=/opt/cloud-project
      ExecStart=/usr/bin/node dist/index.js
      Restart=always
      RestartSec=5
      EnvironmentFile=/opt/cloud-project/.env

      [Install]
      WantedBy=multi-user.target
  - path: /opt/cloud-project/.env
    owner: azureuser:azureuser
    permissions: "0600"
    content: |
      NODE_ENV=production
      PORT=3000
